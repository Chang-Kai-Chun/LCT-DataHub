[project]
name = "lct-datahub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gino", email = "7114065027@smail.nchu.edu.tw" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2",
]

[project.scripts]
lct-datahub = "lct_datahub:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv.workspace]
members = [
    "front",
]
